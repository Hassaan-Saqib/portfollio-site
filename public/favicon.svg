<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Badge -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#04060c" stroke="url(#cyberGrad)" stroke-width="2.5" />

  <!-- Subtle Coordinate Grid Lines -->
  <line x1="2" y1="32" x2="62" y2="32" stroke="rgba(0, 240, 255, 0.15)" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="32" y1="2" x2="32" y2="62" stroke="rgba(0, 240, 255, 0.15)" stroke-width="1" stroke-dasharray="2,2" />

  <!-- Terminal Prompt Symbol > -->
  <path d="M12 24 L22 32 L12 40" fill="none" stroke="#00ff88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Monogram MH -->
  <text x="36" y="38" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="20" font-weight="900" fill="#00f0ff" text-anchor="middle" letter-spacing="-1">MH</text>

  <!-- Live Pulse Dot -->
  <circle cx="50" cy="18" r="3" fill="#00ff88" filter="url(#glow)" />
</svg>
